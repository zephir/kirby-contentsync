services:
  cs_server:
    build:
      context: ./docker
      args:
        KIRBY_VERSION: ${KIRBY_VERSION:-5.6.4}
    environment:
      - USERID=${UID}
    volumes:
      - ./docker/config.php:/var/www/html/site/config/config.php
      - ./:/var/www/html/site/plugins/kirby-contentsync
    ports:
      - 7777:80
    healthcheck:
      disable: true

  cs_receiver:
    build:
      context: ./docker
      args:
        KIRBY_VERSION: ${KIRBY_VERSION:-5.6.4}
    environment:
      - USERID=${UID}
    volumes:
      - ./docker/config.php:/var/www/html/site/config/config.php
      - ./docker/receiver/content:/var/www/html/content
      - ./:/var/www/html/site/plugins/kirby-contentsync
    ports:
      - 7778:80
    healthcheck:
      disable: true